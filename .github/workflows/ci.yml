name: CI

on:
  push:
    branches: [build, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Cache official rule sets and fixtures
        uses: actions/cache@v6
        with:
          path: |
            .cache/downloads
            packages/einvoice/rules
          key: rules-${{ hashFiles('tools/rules/versions.json', 'tools/rules/build.mjs') }}
      - name: Fetch and compile rules (EN 16931, XRechnung), fixtures, KoSIT validator
        run: node tools/rules/build.mjs --kosit
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests with coverage (threshold 80 %)
        run: pnpm coverage
      - name: Web app unit tests
        run: pnpm --filter web test
      - name: KoSIT validator accepts all generated XRechnung files
        run: node tools/ci/kosit.mjs
      - name: veraPDF confirms PDF/A-3b for all generated ZUGFeRD files
        run: tools/ci/verapdf.sh
      - name: Coverage summary
        if: always()
        run: |
          node -e "const s=require('./packages/einvoice/coverage/coverage-summary.json').total;console.log('| Metric | % |\n|---|---|\n'+Object.entries(s).map(([k,v])=>'| '+k+' | '+v.pct+' |').join('\n'))" >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm build
      - name: npm pack (package contents)
        working-directory: packages/einvoice
        run: npm pack --dry-run
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: generated-invoices
          path: |
            .cache/generated
            .cache/kosit-reports
          retention-days: 7

  web:
    name: Web app (E2E, accessibility, Lighthouse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache official rule sets and fixtures
        uses: actions/cache@v6
        with:
          path: |
            .cache/downloads
            packages/einvoice/rules
          key: rules-${{ hashFiles('tools/rules/versions.json', 'tools/rules/build.mjs') }}
      - run: node tools/rules/build.mjs
      - run: pnpm --filter web build
      - name: Install Playwright browser
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E tests (main flow, privacy, axe WCAG 2.1 AA) on desktop and mobile
        run: pnpm e2e
      - name: Lighthouse mobile (performance >= 0.9, accessibility = 1)
        run: npx -y @lhci/cli@0.16.1 autorun
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-reports
          path: |
            apps/web/playwright-report
            .lighthouseci
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 3

  deploy-preview:
    name: Deploy preview (Cloudflare Pages, branch build)
    needs: [check, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/build'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: dist
      - name: Skip without Cloudflare secrets
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN not set, preview deploy skipped (see OFFEN.md)" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy to the preview alias build.einvoice-kit.pages.dev
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx -y wrangler@4 pages deploy dist --project-name einvoice-kit --branch build --commit-dirty=true
