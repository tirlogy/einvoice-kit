version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # keep the types in line with the Node LTS used in CI
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # pinned on purpose, see docs/adr/0002
      - dependency-name: 'xslt3'
      - dependency-name: 'saxon-js'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
